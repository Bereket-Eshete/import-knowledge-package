[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "import-kb"
version = "0.2.4"
description = "A package for importing knowledge and embedding text."
readme = "README.md"
authors = [
    { name = "Coderskin", email = "nebiyu.samuel@singularitynet.io" }
]
license = { text = "MIT" }
keywords = ["knowledge", "embedding", "openai", "chromadb"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "chromadb>=0.3.21",
    "python-dotenv>=0.20.0",
    "tqdm>=4.64.0",
    "sentence-transformers>=2.2.0",
    "torch>=2.5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.2.5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
import_knowledge = ["KB/*.jsonl", "KB/*.metta"]

[project.scripts]
import-knowledge = "import_knowledge.import_knowledge:main"